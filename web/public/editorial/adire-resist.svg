<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">The principle of resist-dyeing</title><desc id="d">Three simplified cloth panels show protecting areas, applying dye and revealing a light design. The invented teaching pattern is not a historic textile. No chemical recipe.</desc><rect width="1200" height="600" fill="#0c2044"/><g font-family="system-ui,sans-serif" fill="#f4ead7"><text x="65" y="85" font-size="29">01 · PROTECT</text><text x="465" y="85" font-size="29">02 · DYE</text><text x="865" y="85" font-size="29">03 · REVEAL</text></g><rect x="65" y="130" width="270" height="330" fill="#f4ead7"/><path d="M65 215H335M65 375H335" stroke="#b6a280" stroke-width="35"/><rect x="465" y="130" width="270" height="330" fill="#34629c"/><path d="M465 215H735M465 375H735" stroke="#b6a280" stroke-width="35"/><rect x="865" y="130" width="270" height="330" fill="#34629c"/><path d="M865 215H1135M865 375H1135" stroke="#f4ead7" stroke-width="35"/><path d="M365 295H430m-15-15 15 15-15 15M765 295H830m-15-15 15 15-15 15" fill="none" stroke="#e5b989" stroke-width="4"/><text x="65" y="535" font-family="system-ui,sans-serif" fill="#f4ead7" font-size="24">Original teaching illustration · no named historical design</text></svg>
