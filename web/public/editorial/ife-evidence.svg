<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Four questions for an object record</title><desc id="d">An original editorial diagram: material, catalogue date, find context and interpretation are separate questions. No historic object is reconstructed.</desc><rect width="1200" height="600" fill="#efe3cb"/><circle cx="600" cy="300" r="215" fill="#b56c47"/><circle cx="600" cy="300" r="160" fill="none" stroke="#f4ead7" stroke-width="2"/><circle cx="600" cy="300" r="110" fill="none" stroke="#f4ead7" stroke-width="2"/><g fill="#172d30" font-family="system-ui,sans-serif"><rect x="55" y="80" width="355" height="160" rx="4" fill="#172d30"/><rect x="790" y="80" width="355" height="160" rx="4" fill="#172d30"/><rect x="55" y="360" width="355" height="160" rx="4" fill="#172d30"/><rect x="790" y="360" width="355" height="160" rx="4" fill="#172d30"/></g><g fill="#f4ead7" font-family="system-ui,sans-serif" font-size="30"><text x="85" y="130">01 · MATERIAL</text><text x="85" y="185" font-size="23">What survives?</text><text x="820" y="130">02 · DATE</text><text x="820" y="185" font-size="23">What range is recorded?</text><text x="85" y="410">03 · CONTEXT</text><text x="85" y="465" font-size="23">Where was it found?</text><text x="820" y="410">04 · INTERPRETATION</text><text x="820" y="465" font-size="23">What remains uncertain?</text><text x="600" y="290" text-anchor="middle" font-size="24">LOOK</text><text x="600" y="335" text-anchor="middle" font-size="24">AGAIN</text></g></svg>
