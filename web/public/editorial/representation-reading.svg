<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><title>Three questions for reading a public-money record</title><desc>A conceptual reading aid, not a historical chart: who proposes, who is represented, who approves?</desc><rect width="1200" height="600" fill="#173236"/><g fill="#213e43" stroke="#d2ab73" stroke-width="2"><rect x="60" y="120" width="320" height="360" rx="8"/><rect x="440" y="120" width="320" height="360" rx="8"/><rect x="820" y="120" width="320" height="360" rx="8"/></g><g stroke="#d2ab73" stroke-width="4" fill="none"><path d="M130 220h180m-180 35h140m-140 35h160m-160 35h100"/><circle cx="600" cy="230" r="35"/><path d="M530 320q70-80 140 0m-100-100h-60m180 0h-60"/><path d="M900 260l45 45 110-110m-150 140h160"/></g><g fill="#f4ead7" font-family="Georgia,serif" font-size="31" text-anchor="middle"><text x="220" y="400">Who proposes?</text><text x="600" y="400">Who is represented?</text><text x="980" y="400">Who approves?</text></g><text x="600" y="550" fill="#d2ab73" font-family="sans-serif" font-size="22" text-anchor="middle">Conceptual reading questions · not an authenticated institutional diagram</text></svg>
