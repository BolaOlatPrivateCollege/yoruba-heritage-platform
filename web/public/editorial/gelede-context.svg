<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">An object within layers of context</title><desc id="d">Original editorial diagram: a collected object sits within questions about performance, explanation and community. It depicts no authentic mask, sacred sign or ritual arrangement.</desc><rect width="1200" height="600" fill="#c7a47c"/><g fill="none" stroke="#172d30" stroke-width="2"><rect x="55" y="45" width="1090" height="510" rx="220"/><rect x="165" y="115" width="870" height="370" rx="175"/><rect x="285" y="185" width="630" height="230" rx="110"/></g><rect x="425" y="250" width="350" height="100" rx="50" fill="#172d30"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="600" y="90" fill="#172d30" font-size="28">COMMUNITY · who can explain?</text><text x="600" y="160" fill="#172d30" font-size="28">EXPLANATION · what is argued?</text><text x="600" y="230" fill="#172d30" font-size="27">PERFORMANCE · what happens?</text><text x="600" y="310" fill="#f4ead7" font-size="28">COLLECTED OBJECT</text><text x="600" y="525" fill="#172d30" font-size="22">Concept diagram · not a ceremonial image or sequence</text></g></svg>
