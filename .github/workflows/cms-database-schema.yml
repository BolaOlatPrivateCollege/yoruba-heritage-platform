name: CMS database schema
on:
  pull_request:
    paths:
      - "cms/migrations/**"
      - "cms/integration/**"
      - "cms/postgres-private-draft-repository.mjs"
      - "web/src/lib/editorial-workflow.ts"
      - "web/src/lib/editorial-content-contract.ts"
      - ".github/workflows/cms-database-schema.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cms_ci
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: cms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms_ci -d cms_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.4"
      - name: Verify private schema migration on disposable Postgres
        env:
          PGPASSWORD: local_ci_only
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" -v "$PWD":/workspace:ro \
            postgres:16 psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U cms_ci -d cms_ci \
            -f /workspace/cms/migrations/001_private_editorial_schema.sql
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" -v "$PWD":/workspace:ro \
            postgres:16 psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U cms_ci -d cms_ci \
            -f /workspace/cms/migrations/001_smoke_test.sql
      - name: Install locked web validation dependencies
        run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - name: Install isolated PostgreSQL integration test client
        run: npm install --prefix cms --no-save --no-package-lock --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Test real PostgreSQL private drafts, concurrency and rollback
        env:
          CMS_TEST_DATABASE_URL: postgres://cms_ci:local_ci_only@127.0.0.1:5432/cms_ci
        run: node --experimental-strip-types --test cms/integration/postgres-private-drafts.integration.test.mjs
